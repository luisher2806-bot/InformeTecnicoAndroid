name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Reconstruir archivos de la app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/informetecnico/app
          mkdir -p app/src/main/assets/www
          base64 -d build_payload/mainactivity.b64 > app/src/main/java/com/informetecnico/app/MainActivity.java
          cat build_payload/index_00.b64 build_payload/index_01.b64 build_payload/index_02.b64 build_payload/index_03.b64 | base64 -d | gzip -dc > app/src/main/assets/www/index.html
          base64 -d build_payload/clientes.b64 > app/src/main/assets/www/plantilla_clientes.xlsx
          base64 -d build_payload/responsables.b64 > app/src/main/assets/www/plantilla_empresas_responsables.xlsx

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InformeTecnico.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: InformeTecnico-Android-APK
          path: InformeTecnico.apk
          if-no-files-found: error
